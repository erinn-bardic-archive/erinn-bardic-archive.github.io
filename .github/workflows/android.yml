name: 출근콕 이전 정리

# 앱은 claude-apps-archive/chulgeun-kok 로 옮겼다. 이 저장소에 남은 예전 APK 릴리스를 지운다.
on:
  push:
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest --yes --cleanup-tag
