name: 출근콕 APK 빌드

on:
  push:
    paths:
      - "worklog-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worklog-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 선택: 저장소 Secrets 에 SIGNING_KEYSTORE_BASE64 등을 넣어 두면 매번 같은 키로 서명되어
      # 앱을 지우지 않고 업데이트 설치할 수 있다.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../chulgeunkok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chulgeunkok-apk
          path: chulgeunkok.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ../chulgeunkok.apk \
            --target "${{ github.sha }}" \
            --title "출근콕 APK (최신)" \
            --notes "휴대폰에서 chulgeunkok.apk 를 눌러 다운로드한 뒤 설치하세요. 빌드 커밋: ${{ github.sha }}"
